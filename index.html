function event(title,text,kind='Political'){state.events.unshift({title,text,date:state.date,kind});state.news.unshift({title,text,date:state.date});if(state.news.length>40)state.news.pop();save(true)}
function pageHead(k,title,sub,actions=''){return `<div class="pagehead"><div><div class="eyebrow">${esc(k)}</div><h1>${esc(title)}</h1><div class="sub">${esc(sub)}</div></div><div class="headright">${actions}</div></div>`}
function card(title,body,extra=''){return `<section class="card ${extra}"><div class="cardhead">${title}</div><div class="cardbody">${body}</div></section>`}
function metric(label,value,note='',color=''){return `<div class="metric"><label>${label}</label><strong class="${color}">${value}</strong><small>${note}</small></div>`}
function field(label,name,value,type='text',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function selectField(label,name,options,value){return `<div class="field"><label>${label}</label><select name="${name}">${options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function startScreen(){return `<div class="startscreen"><div class="startpanel"><div class="startvisual"><div><div class="eyebrow">POLITICAL STRATEGY • CAREER RPG</div><h1>NATION:<br>RISE TO POWER</h1><p>Every decision shapes your political future. Build trust, win support, lead institutions and govern with consequences.</p></div><div class="row wrap"><span class="pill">◈ Landscape-first</span><span class="pill">◎ Offline-ready</span><span class="pill">✦ v0.0.6</span></div></div><div class="startactions"><div class="eyebrow">A NEW POLITICAL ERA</div><h2>Enter the arena.</h2><p class="muted">Start as an ordinary citizen. Your power must be earned.</p><button class="btn gold" data-action="new-game">＋ &nbsp; New Game</button><button class="btn" data-action="continue">▷ &nbsp; Continue</button><button class="btn" data-action="load-game">▤ &nbsp; Load Game</button><button class="btn" data-action="settings">⚙ &nbsp; Settings</button><button class="btn" data-action="credits">✦ &nbsp; Credits & Project Info</button><div class="footnote">Fictional political simulation. State and seat baselines are provided for gameplay orientation; simulated outcomes are not real-world reporting.</div></div></div></div>`}
function dashboard(){const p=state.player;return pageHead('YOUR POLITICAL JOURNEY','Main Dashboard',`${p.name} • ${p.position} • ${dateLabel()}`,`<button class="btn small" data-action="advance">▶ Advance 1 Day</button><button class="btn small" data-action="save">Save Game</button>`)+`<div class="hero" style="margin-bottom:12px"><div><div class="eyebrow">YOUR STORY. YOUR DECISIONS.</div><h2>Power is earned.</h2><p>${esc(p.name)}, your journey begins in ${esc(p.home)}. Build your reputation, grow your network and turn public trust into political influence.</p><div class="row wrap"><span class="pill">${esc(p.position)}</span><span class="pill">${esc(p.profession)}</span><span class="pill">Day ${state.turn+1}</span></div></div></div><div class="metricgrid">${metric('Public approval',state.approval+'%','Current simulated support','goldtext')}${metric('Personal funds',money(state.money),'Salary and expenses')}${metric('Party strength',state.partySupport+'%','Estimated support')}${metric('Reputation',p.reputation+'/100','Earned through decisions')}</div><div class="grid" style="margin-top:12px">${card('Political calendar',`<div class="timeline"><div class="event"><strong>Local outreach</strong><br><small>Today • Build relationships in ${esc(p.home)}</small></div><div class="event"><strong>Party strategy meeting</strong><br><small>In 3 days • Organization and candidate planning</small></div><div class="event"><strong>Simulated state election</strong><br><small>In 162 days • Election date is a game scenario</small></div></div>`,'span6')}${card('Your next moves',`<div class="list"><div class="listitem"><span class="avatar">⚑</span><div class="itemmain"><strong>Plan an election campaign</strong><small>Actions cost funds and change campaign strength.</small></div><button class="btn small" data-go="election">Open</button></div><div class="listitem"><span class="avatar">✥</span><div class="itemmain"><strong>Build your party network</strong><small>Recruit members and invest in organization.</small></div><button class="btn small" data-go="party">Open</button></div><div class="listitem"><span class="avatar">⚒</span><div class="itemmain"><strong>Propose a policy or project</strong><small>Costs, time and public outcomes are tracked.</small></div><button class="btn small" data-go="policy">Open</button></div></div>`,'span6')}${card('Recent developments',state.events.slice(0,4).map(e=>`<div class="listitem"><span class="avatar">${e.kind==='Project'?'⌂':'✦'}</span><div class="itemmain"><strong>${esc(e.title)}</strong><small>${esc(e.date)} · ${esc(e.text)}</small></div></div>`).join('')||'<p class="muted">No events yet.</p>','span12')}</div>`}
function mapPage(){const s=STATES.find(x=>x[0]===selectedState)||STATES[13];const seats=selectedLeg==='Assembly'?s[1]:s[2];const regions=['North','South','East','West','Central','Rural','Urban','Valley'];return pageHead('POLITICAL GEOGRAPHY','India Map & Constituencies','Select a state, then explore a fictionalized constituency view.',`<select id="leg-select" aria-label="Legislature"><option ${selectedLeg==='Assembly'?'selected':''}>Assembly</option><option ${selectedLeg==='Lok Sabha'?'selected':''}>Lok Sabha</option></select>`)+`<div class="grid">${card('State / UT selection',`<div class="maptiles">${STATES.map(x=>`<button class="statebtn ${selectedState===x[0]?'active':''}" data-state="${esc(x[0])}"><strong>${esc(x[0])}</strong><small>${x[1]} Assembly • ${x[2]} Lok Sabha</small></button>`).join('')}</div><p class="footnote" style="margin-top:12px">Seat counts are baseline reference values and should be re-verified against current official sources before release. Constituency labels below are fictional game labels, not official Election Commission names.</p>`,'span8')}${card('Selected region',`<div class="hero" style="min-height:135px;padding:18px"><div><div class="eyebrow">${esc(selectedLeg.toUpperCase())} VIEW</div><h2 style="font-size:26px">${esc(selectedState)}</h2><p>${seats} ${selectedLeg==='Assembly'?'Assembly constituencies':'Lok Sabha seats'} • Simulated political overview</p></div></div><div class="metricgrid" style="grid-template-columns:repeat(2,1fr);margin-top:10px">${metric('Seats',seats,'Reference baseline')}${metric('Your support',state.approval+'%','Simulated')}</div>`,'span4')}${card('Constituency explorer',`<div class="row wrap" style="margin-bottom:12px"><input id="seat-search" placeholder="Search fictional constituency…" style="flex:1"><select id="region-filter"><option value="All">All regions</option>${regions.map(r=>`<option>${r}</option>`).join('')}</select></div><div id="seat-results" class="list"></div>`,'span12')}</div>`}
function makeSeats(){const s=STATES.find(x=>x[0]===selectedState)||STATES[13],count=selectedLeg==='Assembly'?s[1]:s[2];if(!count)return [];let arr=[];for(let i=1;i<=Math.min(count,100);i++){let region=['North','South','East','West','Central','Rural','Urban','Valley'][i%8];let nm=selectedState==='Maharashtra'?['Amravati West','Vidarbha North','Marathwada Central','Konkan Coast','Nagpur East','Pune Rural','Mumbai Harbour','Nashik Valley'][i%8]:selectedState==='Uttar Pradesh'?['Awadh Central','Doab West','Purvanchal East','Rohilkhand North','Bundelkhand South','Ganga Valley','Terai North','Agra Urban'][i%8]:[`${selectedState.split(' ')[0]} ${region}`,`${selectedState.split(' ')[0]} ${region} Central`,`${selectedState.split(' ')[0]} ${region} North`,`${selectedState.split(' ')[0]} ${region} East`][i%4];arr.push({id:`${selectedState.replace(/[^A-Z]/gi,'').slice(0,3).toUpperCase()}-${selectedLeg==='Assembly'?'AC':'LS'}-${String(i).padStart(4,'0')}`,name:nm,region})}return arr}
function renderSeats(){const root=$('#seat-results');if(!root)return;const q=($('#seat-search')?.value||'').toLowerCase(),reg=$('#region-filter')?.value||'All';const seats=makeSeats().filter(s=>s.name.toLowerCase().includes(q)&&(reg==='All'||s.region===reg));root.innerHTML=`<div class="muted" style="font-size:10px;margin-bottom:4px">${seats.length} matching fictional records · ${selectedState} · ${selectedLeg}</div>`+(seats.slice(0,100).map(s=>`<div class="listitem"><span class="avatar">⌖</span><div class="itemmain"><strong>${esc(s.name)}</strong><small>${esc(s.id)} · ${esc(s.region)} · ${selectedLeg}</small></div><button class="btn small" data-seat="${esc(s.name)}">Open profile</button></div>`).join('')||'<p class="muted">No matching constituency.</p>');}
function electionPage(){const e=state.election;return pageHead('CAMPAIGN CONTROL ROOM','Election Campaign','Plan actions, manage resources and review why results happened.',`<button class="btn small" data-action="new-election">＋ New Election</button>`)+`<div class="grid">${card('Campaign status',e?`<div class="metricgrid" style="grid-template-columns:repeat(2,1fr)">${metric('Phase',esc(e.phase),'Current stage')}${metric('Voters',e.voters.toLocaleString('en-IN'),'Simulated electorate')}${metric('Campaign score',e.score,'Built by actions')}${metric('Budget left',money(e.budget-e.spent),'Campaign resources')}</div><div class="row wrap" style="margin-top:12px">${e.phase==='Campaign'?'<button class="btn gold" data-action="start-poll">Start Polling</button>':''}${e.phase==='Polling'?'<button class="btn gold" data-action="count-votes">Count Votes</button>':''}${e.phase==='Results'?'<button class="btn" data-action="new-election">New Election</button>':''}</div>`:`<div class="hero" style="min-height:140px"><div><h2 style="font-size:26px">Your next election awaits.</h2><p>Set up a constituency contest, nominate candidates, spend strategically, and inspect the outcome.</p><button class="btn gold" data-action="new-election">Set Up Election</button></div></div>`,'span8')}${card('Campaign actions',`<div class="list">${[['Constituency visit',25000,2,'Build local connection'],['Public rally',150000,5,'Reach a wider audience'],['Door-to-door outreach',50000,4,'Improve local trust'],['Manifesto announcement',75000,3,'Clarify priorities'],['Volunteer mobilisation',60000,4,'Improve campaign capacity'],['Digital outreach',90000,3,'Increase visibility'],['Local issue research',35000,3,'Identify voter concerns']].map(a=>`<div class="listitem"><span class="avatar">⚑</span><div class="itemmain"><strong>${a[0]}</strong><small>${a[3]} · Cost ${money(a[1])}</small></div><button class="btn small" data-campaign="${a[0]}" data-cost="${a[1]}" data-score="${a[2]}">Execute</button></div>`).join('')}</div><p class="footnote">Actions are available during campaign setup/active campaign. Effects are simulated and do not guarantee victory.</p>`,'span4')}${e?.result?card('Declared election result',`<div class="metricgrid" style="grid-template-columns:repeat(3,1fr)">${metric('Winner',esc(e.result.winner),'Winning candidate','green')}${metric('Votes',e.result.winnerVotes.toLocaleString('en-IN'),'Valid votes')}${metric('Victory margin',e.result.margin.toLocaleString('en-IN'),'Over runner-up')}</div><div class="barrow"><span>Turnout</span><div class="progress"><i style="width:${Math.round(e.result.turnout/e.voters*100)}%"></i></div><b>${Math.round(e.result.turnout/e.voters*100)}%</b></div><h3>Candidate vote totals</h3><div class="tablewrap"><table><thead><tr><th>Candidate</th><th>Party</th><th>Votes</th><th>Vote share</th><th>Factor score</th></tr></thead><tbody>${e.result.rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.party)}</td><td>${r.votes.toLocaleString('en-IN')}</td><td>${r.share}%</td><td>${r.score}</td></tr>`).join('')}</tbody></table></div><h3>Why the winner won</h3><p>The winner had the highest combined score across reputation, development, campaign activity, manifesto, party support and local connection. The model is simplified; it does not yet calculate voter-group-level causal contributions.</p>`,'span12'):''}${card('Election results & history',state.electionHistory.length?`<div class="tablewrap"><table><thead><tr><th>Contest</th><th>Winner</th><th>Votes</th><th>Margin</th><th>Date</th></tr></thead><tbody>${state.electionHistory.map(r=>`<tr><td>${esc(r.seat)}</td><td>${esc(r.winner)}</td><td>${r.winnerVotes.toLocaleString('en-IN')}</td><td>${r.margin.toLocaleString('en-IN')}</td><td>${esc(r.date)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No completed elections saved yet.</p>','span12')}</div>`}
function newElectionModal(){modal('Set Up Election',`<form id="election-form"><div class="formgrid">${selectField('Election type','type',['State Assembly','Lok Sabha','By-election'],'State Assembly')}${field('Constituency name','seat',selectedState==='Maharashtra'?'Amravati West':selectedState+' Central')}${field('Simulated electorate','voters','50000','number')}${selectField('Your candidate','playerCandidate',['Player Candidate','Arjun Pratap','Meera Sharma','Independent Candidate'],'Player Candidate')}</div><p class="footnote">Voter count is a game scenario, not verified real constituency data. This contest uses a simplified transparent vote model.</p><div class="row between" style="margin-top:16px"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn gold" type="submit">Create Contest</button></div></form>`)}
function partyPage(){return pageHead('ORGANIZATION & LEADERSHIP','Party Office','Grow your organization, recruit members and manage party resources.',`<button class="btn small" data-action="create-party">Create Party</button>`)+`<div class="metricgrid">${metric('Party',esc(state.partyName),'Current affiliation')}${metric('Members',state.members.toLocaleString('en-IN'),'Organization network')}${metric('Party funds',money(state.treasury),'Shared treasury')}${metric('Support',state.partySupport+'%','Simulated public support')}</div><div class="grid" style="margin-top:12px">${card('Party overview',`<div class="hero" style="min-height:145px"><div><div class="eyebrow">POLITICAL ORGANIZATION</div><h2>${esc(state.partyName)}</h2><p>Build a durable party through membership, local units, training and accountable finances.</p></div></div><div class="row wrap" style="margin-top:12px"><button class="btn gold" data-action="recruit">Recruit Members · ${money(25000)}</button><button class="btn" data-action="training">Leadership Training · ${money(50000)}</button><button class="btn" data-action="party-meeting">Hold Party Meeting · ${money(15000)}</button></div>`,'span7')}${card('Organization metrics',`<div class="barrow"><span>Public support</span><div class="progress"><i style="width:${state.partySupport}%"></i></div><b>${state.partySupport}%</b></div><div class="barrow"><span>Member loyalty</span><div class="progress"><i style="width:${Math.min(95,45+state.members/80)}%"></i></div><b>${Math.min(95,Math.round(45+state.members/80))}%</b></div><div class="barrow"><span>Local presence</span><div class="progress"><i style="width:${Math.min(90,15+state.members/50)}%"></i></div><b>${Math.min(90,Math.round(15+state.members/50))}%</b></div><p class="footnote">Recruitment consumes funds. Training improves player skill/reputation. These values are simulated game metrics.</p>`,'span5')}${card('Candidate roster',state.candidates.map(c=>`<div class="listitem"><span class="avatar">${esc(c.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</span><div class="itemmain"><strong>${esc(c.name)}</strong><small>${esc(c.party)} · ${esc(c.seat)} · Popularity ${c.popularity}%</small></div><span class="tag">Loyalty ${c.loyalty}%</span></div>`).join(''),'span12')}</div>`}
function meetingPage(){return pageHead('POLITICAL RELATIONSHIPS','Meeting Room','Negotiate alliances, support agreements and leadership arrangements.',`<button class="btn small" data-action="meeting">Schedule Meeting</button>`)+`<div class="grid">${card('Negotiation table',`<div class="list">${PARTIES.filter(p=>p.name!==state.partyName).map(p=>`<div class="listitem"><span class="avatar">✥</span><div class="itemmain"><strong>${esc(p.name)}</strong><small>${esc(p.ideology)} · Estimated support ${p.support}%</small></div><button class="btn small" data-negotiate="${esc(p.name)}">Propose alliance</button></div>`).join('')}</div><p class="footnote">Alliance proposals can succeed or fail based on simulated relationship, support and political compatibility. Agreements do not create extra legislative seats.</p>`,'span7')}${card('Relationship ledger',Object.entries(state.relationships).length?Object.entries(state.relationships).map(([n,v])=>`<div class="barrow"><span>${esc(n)}</span><div class="progress"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div><b>${v}</b></div>`).join(''):'<p class="muted">No formal political relationships yet. Propose an alliance to begin negotiations.</p>','span5')}</div>`}
function warPage(){const parties=PARTIES.map(p=>({...p,s:Math.max(3,p.support+Math.round((state.partySupport-p.support)*.2))}));return pageHead('STRATEGIC INTELLIGENCE','War Room','Review seat projections, campaign strength and political risks.')+`<div class="grid">${card('Simulated party strength',parties.map(p=>`<div class="barrow"><span>${esc(p.short)}</span><div class="progress"><i style="width:${p.s}% ;background:${p.color}"></i></div><b>${p.s}%</b></div>`).join('')+'<p class="footnote">Illustrative projection only; not based on verified constituency polling.</p>','span7')}${card('Strategic assessment',`<div class="listitem"><span class="avatar">⌕</span><div class="itemmain"><strong>Reputation</strong><small>${state.player.reputation<40?'Needs improvement: focus on local service and consistency.':'A developing asset; maintain public visibility.'}</small></div></div><div class="listitem"><span class="avatar">₹</span><div class="itemmain"><strong>Resource position</strong><small>${state.money<100000?'Funds are tight. Avoid expensive low-impact actions.':'Budget allows measured outreach and local issue work.'}</small></div></div><div class="listitem"><span class="avatar">⚑</span><div class="itemmain"><strong>Campaign readiness</strong><small>${state.campaign.score<10?'Early stage. Run targeted outreach before polling.':'Campaign activity is building; assess diminishing returns.'}</small></div></div>`,'span5')}${card('Candidate comparison',`<div class="tablewrap"><table><thead><tr><th>Candidate</th><th>Popularity</th><th>Skill</th><th>Loyalty</th></tr></thead><tbody>${state.candidates.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.popularity}%</td><td>${c.skill}/100</td><td>${c.loyalty}%</td></tr>`).join('')}</tbody></table></div>`,'span12')}</div>`}
function candidatesPage(){return pageHead('CANDIDATE MANAGEMENT','Candidates','Recruit and compare candidates; election eligibility is checked by the contest workflow.',`<button class="btn small gold" data-action="add-candidate">＋ Add Candidate</button>`)+`<div class="grid">${card('Candidate directory',`<div class="list">${state.candidates.map((c,i)=>`<div class="listitem"><span class="avatar">${esc(c.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</span><div class="itemmain"><strong>${esc(c.name)}</strong><small>${esc(c.profession)} · ${esc(c.education)} · ${esc(c.seat)}</small><div class="row wrap" style="margin-top:5px"><span class="pill">Popularity ${c.popularity}%</span><span class="pill">Skill ${c.skill}</span><span class="pill">Loyalty ${c.loyalty}%</span></div></div><button class="btn small" data-candidate-edit="${i}">Edit</button></div>`).join('')}</div>`,'span8')}${card('Selection rules',`<p>Candidate strength is based on reputation, local connection, experience, skill and party support.</p><div class="listitem"><span class="avatar">✓</span><div class="itemmain"><strong>Nomination validation</strong><small>Candidate must be attached to the current contest before polling.</small></div></div><div class="listitem"><span class="avatar">!</span><div class="itemmain"><strong>Known limitation</strong><small>Comprehensive legal eligibility, proposer requirements and duplicate-seat enforcement are not yet fully implemented.</small></div></div>`,'span4')}</div>`}
function mediaPage(){return pageHead('PRESS & PUBLIC NARRATIVE','Newspapers','Game-generated headlines and archive of political events.')+`<div class="grid">${card('Latest headlines',state.news.length?state.news.map(n=>`<div class="listitem"><span class="avatar">▤</span><div class="itemmain"><strong>${esc(n.title)}</strong><small>${esc(n.date)} · ${esc(n.text)}</small></div><span class="tag">SIMULATED</span></div>`).join(''):'<p class="muted">No headlines yet. Political actions and game events will populate the archive.</p>','span8')}${card('Editorial desk',`<p>Generate a simulated story from your current political state.</p><div class="list"><button class="btn" data-action="headline" data-kind="Campaign">Campaign update</button><button class="btn" data-action="headline" data-kind="Party">Party organization report</button><button class="btn" data-action="headline" data-kind="Policy">Policy announcement</button></div><p class="footnote">All headlines are fictional in-game content, not real-world reporting.</p>`,'span4')}</div>`}
function tvPage(){return pageHead('LIVE NEWS SIMULATION','TV News Broadcast','Broadcast-style political coverage driven by simulated events.')+`<div class="grid">${card('NATION NEWS NETWORK',`<div class="hero" style="min-height:250px;align-items:flex-end;background:radial-gradient(ellipse at 50% 30%,#33536a,transparent 55%),linear-gradient(120deg,#0a1520,#172d3e 60%,#503a26)"><div style="width:100%"><span class="pill" style="background:#a02d34;color:white">● LIVE SIMULATION</span><h2 style="font-size:32px">The Political Desk</h2><p>Election coverage • Public policy • Parliamentary debate • Crisis response</p><div style="background:#b92c39;padding:10px;border-radius:5px;font-weight:800">${esc(state.news[0]?.title||'NATION: Your political story is unfolding')}</div></div></div><div class="row wrap" style="margin-top:12px"><button class="btn gold" data-action="broadcast">Broadcast announcement</button><button class="btn" data-go="media">Open news archive</button></div>`,'span8')}${card('Broadcast rundown',`<div class="timeline"><div class="event"><strong>Political headlines</strong><br><small>Latest simulated events</small></div><div class="event"><strong>Opposition reaction</strong><br><small>Generated from relationship and policy state</small></div><div class="event"><strong>Public opinion</strong><br><small>Approval currently ${state.approval}%</small></div></div>`,'span4')}</div>`}
function parliamentPage(){const total=543, majority=272, seats=Math.round(total*state.partySupport/100);return pageHead('LEGISLATURE & GOVERNMENT','Parliament','Legislative business, voting and government formation overview.')+`<div class="metricgrid">${metric('Lok Sabha seats',total,'Reference total; verify before release')}${metric('Majority mark',majority,'Simple majority example')}${metric('Your party projection',seats,'Illustrative, not election-derived')}${metric('Government',state.government?esc(state.government):'Not formed','Formation requires seat arithmetic')}</div><div class="grid" style="margin-top:12px">${card('Parliamentary business',`<div class="list"><div class="listitem"><span class="avatar">▤</span><div class="itemmain"><strong>Introduce a bill</strong><small>Policy proposal enters legislative consideration.</small></div><button class="btn small" data-action="bill">Draft bill</button></div><div class="listitem"><span class="avatar">⚖</span><div class="itemmain"><strong>Parliamentary debate</strong><small>Debate may shift relationships and public opinion.</small></div><button class="btn small" data-action="debate">Schedule</button></div><div class="listitem"><span class="avatar">✓</span><div class="itemmain"><strong>Government formation</strong><small>Use seat totals; no negotiation can create seats.</small></div><button class="btn small" data-action="form-government">Check numbers</button></div></div>`,'span7')}${card('Legislative safeguards',`<p>Union and State responsibilities must remain separate. Constitutional institutions have defined powers and cannot be controlled arbitrarily.</p><p class="footnote">This v0.0.5 build includes a basic legislative dashboard and proposal log, not a complete constitutional or bicameral simulation.</p>`,'span5')}${card('Bills & decisions',state.policies.length?state.policies.map(p=>`<div class="listitem"><span class="avatar">§</span><div class="itemmain"><strong>${esc(p.name)}</strong><small>${esc(p.category)} · ${esc(p.status||'Proposed')}</small></div><span class="tag">${money(p.cost)}</span></div>`).join(''):'<p class="muted">No bills or policy proposals yet.</p>','span12')}</div>`}
function policyPage(){const cats=['Economy','Education','Healthcare','Infrastructure','Agriculture','Law and order','Environment','Employment','Public services','Water and energy'];return pageHead('POLICY & PUBLIC SERVICES','Policy Making','Policies have costs, timelines, departments and measurable outcomes.',`<button class="btn small gold" data-action="new-policy">＋ Propose Policy</button>`)+`<div class="grid">${card('Policy portfolio',state.policies.length?state.policies.map((p,i)=>`<div class="listitem"><span class="avatar">⚒</span><div class="itemmain"><strong>${esc(p.name)}</strong><small>${esc(p.category)} · ${esc(p.status)} · ${p.months} months</small><div class="progress" style="margin-top:6px"><i style="width:${p.progress||0}%"></i></div></div><span class="tag">${money(p.cost)}</span></div>`).join(''):'<div class="hero" style="min-height:140px"><div><h2 style="font-size:25px">No policies proposed yet</h2><p>Choose a priority and allocate resources. Announcement is not the same as delivery.</p></div></div>','span8')}${card('Priority areas',cats.map(c=>`<div class="listitem"><span class="avatar">${c==='Infrastructure'?'⌂':'⚒'}</span><div class="itemmain"><strong>${c}</strong><small>Proposal, funding, implementation and outcome tracking</small></div><button class="btn small" data-policy-category="${c}">Propose</button></div>`).join(''),'span4')}</div>`}

const PAGES={dashboard, map:mapPage,election:electionPage,party:partyPage,meeting:meetingPage,war:warPage,candidates:candidatesPage,media:mediaPage,tv:tvPage,parliament:parliamentPage,policy:policyPage,governance:governancePage,opinion:opinionPage,events:eventsPage,international:internationalPage,research:researchPage,finance:financePage,achievements:achievementsPage,settings:settingsPage,credits:creditsPage};
function render(){const root=$('#root');if(active==='start'){root.innerHTML=startScreen();return}if(active==='character'){root.innerHTML=`<div class="startscreen"><div class="startpanel"><div class="startvisual"><div class="eyebrow">YOUR JOURNEY BEGINS</div><h1>Create your<br>character.</h1><p>You start as a citizen. Your position must be earned through actions and political circumstances.</p><span class="pill">Age 18 • Citizen</span></div><div class="startactions"><h2>Character creation</h2><form id="character-form"><div class="formgrid">${field('Name','name',state.player.name)}${field('Age','age',18,'number','min="18" max="90"')}${selectField('Profession','profession',PROF,state.player.profession)}${selectField('Home state / UT','home',STATES.map(s=>s[0]),state.player.home)}${selectField('Background','background',['Ordinary citizen','Community volunteer','Student activist','Local entrepreneur','Public-service background'],state.player.background)}${field('Starting personal funds (₹)','money',100000,'number')}</div><p class="footnote">All seven profession choices use the planned ₹45,000 monthly salary in this build. Profession-specific effects and job-retention mechanics are simplified.</p><div class="row between" style="margin-top:14px"><button type="button" class="btn" data-action="back-start">Cancel</button><button class="btn gold" type="submit">Begin Journey →</button></div></form></div></div></div>`;return}const content=PAGES[active]?PAGES[active]():dashboard();root.innerHTML=`<div class="app"><header class="topbar"><div class="brand"><div class="emblem">N</div><div class="brandname">NATION: RISE TO POWER<small>POLITICAL SIMULATION • v0.0.6</small></div></div><div class="topmetric"><small>GAME DATE</small><strong>${dateLabel()}</strong></div><div class="topmetric"><small>POSITION</small><strong>${esc(state.player.position)}</strong></div><div class="topspacer"></div><div class="topmetric"><small>PERSONAL FUNDS</small><strong class="goldtext">${money(state.money)}</strong></div><button class="btn small" data-action="save">Save</button><button class="btn small" data-action="menu">☰</button></header><div class="shell"><aside class="sidebar">${NAV.map((n,i)=>`<div>${(i===0||NAV[i-1][0]!==n[0])?`<div class="navgroup">${n[0]}</div>`:''}<button class="nav ${active===n[3]?'active':''}" data-go="${n[3]}"><span class="ico">${n[1]}</span><span>${n[2]}</span></button></div>`).join('')}<div class="sidebarfoot">${esc(state.player.name)}<br>${esc(state.player.position)}<br><span class="goldtext">${state.approval}% public approval</span></div></aside><main class="main"><section class="page active">${content}</section></main></div></div>`;if(active==='map')renderSeats()}

function closeModal(){$('#modalroot').innerHTML=''}
function createContest(data){const voters=Math.max(100,Math.min(10000000,Number(data.voters)||50000));const candidateName=data.playerCandidate==='Player Candidate'?state.player.name:data.playerCandidate==='Independent Candidate'?state.player.name:data.playerCandidate;let cand=[{name:candidateName,party:state.partyName,rep:state.player.reputation,development:30,campaign:state.campaign.score,manifesto:45,support:state.partySupport,local:50,skill:state.player.skill}];state.candidates.filter(c=>c.name!==candidateName).slice(0,3).forEach(c=>cand.push({name:c.name,party:c.party,rep:c.popularity,development:35,campaign:25,manifesto:45,support:(PARTIES.find(p=>p.name===c.party)||{support:12}).support,local:45,skill:c.skill}));if(!cand.some(c=>c.name==='Independent Candidate'))cand.push({name:'Independent Candidate',party:'Independent',rep:40,development:30,campaign:20,manifesto:40,support:12,local:60,skill:35});state.election={type:data.type,seat:data.seat||'Test Constituency',voters,phase:'Campaign',budget:state.campaign.budget,spent:0,score:0,candidates:cand,playerCandidate:candidateName,result:null,created:state.date};state.campaign={budget:5000000,spent:0,actions:0,score:0};event('Election contest created',`${data.type} at ${data.seat}; ${voters.toLocaleString('en-IN')} simulated voters.`, 'Election');closeModal();go('election')}
function countVotes(){const e=state.election;if(!e||e.phase!=='Polling')return;let scores=e.candidates.map(c=>Math.max(1,((c.rep||30)*.23+(c.development||30)*.17+(c.campaign||20)*.22+(c.manifesto||40)*.12+(c.support||12)*.16+(c.local||35)*.1)));const total=scores.reduce((a,b)=>a+b,0);let turnout=Math.round(e.voters*(.52+Math.min(.18,(e.score||0)/1000)));turnout=Math.max(1,Math.min(e.voters,turnout));let votes=scores.map((s,i)=>Math.floor(turnout*s/total));let rem=turnout-votes.reduce((a,b)=>a+b,0);for(let i=0;i<rem;i++)votes[i%votes.length]++;const sorted=votes.map((v,i)=>({votes:v,c:e.candidates[i]})).sort((a,b)=>b.votes-a.votes);const winner=sorted[0],runner=sorted[1]||{votes:0};e.phase='Results';e.result={turnout,winner:winner.c.name,winnerParty:winner.c.party,winnerVotes:winner.votes,margin:winner.votes-runner.votes,rows:e.candidates.map((c,i)=>({name:c.name,party:c.party,votes:votes[i],share:Math.round(votes[i]/turnout*1000)/10,score:Math.round(scores[i]*10)/10})).sort((a,b)=>b.votes-a.votes),factors:{reputation:winner.c.rep,development:winner.c.development,campaign:winner.c.campaign,manifesto:winner.c.manifesto,partySupport:winner.c.support,local:winner.c.local}};state.electionHistory.unshift({seat:e.seat,winner:winner.c.name,winnerVotes:winner.votes,margin:e.result.margin,date:state.date});state.history.unshift({title:'Election result declared',date:state.date,text:`${winner.c.name} won ${e.seat} with ${winner.votes.toLocaleString('en-IN')} votes from ${turnout.toLocaleString('en-IN')} votes cast.`});if(winner.c.name===state.player.name){state.player.experience+=10;state.player.reputation=Math.min(100,state.player.reputation+8);state.approval=Math.min(95,state.approval+5);state.player.position=e.type==='Lok Sabha'?'MP':'MLA';event('Election victory',`${winner.c.name} won ${e.seat}. Victory changes the player's career status in this simulation.`, 'Election')}else{state.player.experience+=2;state.player.reputation=Math.max(0,state.player.reputation-1);event('Election result',`${winner.c.name} won ${e.seat}; review the factor scores before the next campaign.`, 'Election')}save(true);render();}
function doCampaign(name,cost,score){const e=state.election;if(!e||e.phase!=='Campaign'){toast('Create a contest in Campaign phase first.');return}if(e.spent+cost>e.budget){toast('Campaign budget is insufficient.');return}e.spent+=cost;state.campaign.spent+=cost;state.campaign.actions++;const gain=score/(1+state.campaign.actions*.25);e.score+=gain;state.campaign.score+=gain;const c=e.candidates.find(c=>c.name===e.playerCandidate);if(c){c.campaign=Math.min(100,c.campaign+gain*1.8);c.local=Math.min(100,c.local+(name.includes('visit')||name.includes('door')?gain*1.4:gain*.25));c.manifesto=Math.min(100,c.manifesto+(name.includes('Manifesto')?gain*2:gain*.2));c.rep=Math.min(100,c.rep+gain*.25)}state.player.reputation=Math.min(100,state.player.reputation+(name.includes('outreach')?1:0));state.approval=Math.min(95,state.approval+(name.includes('outreach')?.5:.2));state.money=Math.max(0,state.money-cost);state.expenses+=cost;event(`Campaign action: ${name}`,`Spent ${money(cost)}. Campaign strength increased by ${gain.toFixed(1)} points with diminishing returns.`, 'Campaign');render();toast(`${name} completed.`)}
function action(a,el){switch(a){case'new-game':go('character');break;case'continue':if(state.started)go('dashboard');else go('character');break;case'load-game':loadSlot();break;case'settings':go('settings');break;case'credits':go('credits');break;case'back-start':go('start');break;case'save':save();break;case'advance':advance(1);break;case'menu':go('start');break;case'close-modal':closeModal();break;case'new-election':newElectionModal();break;case'start-poll':if(state.election?.candidates.length){state.election.phase='Polling';event('Polling started',`${state.election.seat}: simulated polling is underway.`,'Election');save(true);render()}break;case'count-votes':countVotes();break;case'recruit':if(state.money<25000||state.treasury<25000){toast('Insufficient funds.');break}state.money-=25000;state.treasury-=25000;state.members+=Math.round(150+Math.random()*100);state.partySupport=Math.min(80,state.partySupport+1);state.player.experience+=1;event('Membership recruitment',`Party membership increased to ${state.members}. Cost ${money(25000)}.`,'Party');save(true);render();break;case'training':if(state.money<50000){toast('Insufficient personal funds.');break}state.money-=50000;state.player.skill=Math.min(100,state.player.skill+5);state.player.reputation=Math.min(100,state.player.reputation+1);event('Leadership training','Skill and reputation improved after training.','Career');save(true);render();break;case'party-meeting':if(state.treasury<15000){toast('Insufficient party funds.');break}state.treasury-=15000;state.members+=10;event('Party strategy meeting','Local units reviewed recruitment and campaign readiness.','Party');save(true);render();break;case'create-party':modal('Create a Political Party',`<form id="party-form">${field('Party name','name','Naya Jan Shakti Party')}<div class="field" style="margin-top:10px"><label>Ideology</label><select name="ideology"><option>Developmental centrist</option><option>Social democratic</option><option>Reformist</option><option>Regionalist</option><option>Environmental</option></select></div><p class="footnote">Creating a party starts with a limited organization and funds.</p><div class="row between" style="margin-top:14px"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn gold">Create Party</button></div></form>`);break;case'meeting':event('Meeting scheduled','Party leaders will review campaign strategy in three days.','Party');toast('Meeting added to political history.');render();break;case'add-candidate':modal('Add Candidate',`<form id="candidate-form"><div class="formgrid">${field('Candidate name','name','Aarav Kulkarni')}${field('Constituency','seat','Amravati West')}${field('Age','age','35','number')}${selectField('Profession','profession',PROF,'Social Worker')}${field('Popularity (0–100)','popularity','45','number')}${field('Skill (0–100)','skill','45','number')}</div><div class="row between" style="margin-top:14px"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn gold">Add Candidate</button></div></form>`);break;case'new-policy':newPolicyModal();break;case'headline':event(`${el.dataset.kind} update`,`${state.partyName} is navigating a changing political environment. Public approval is ${state.approval}%.`,'Media');render();toast('Simulated headline generated.');break;case'broadcast':event('NATION News broadcast','The Political Desk covered the latest simulated political developments.','Media');render();break;case'bill':newPolicyModal();break;case'debate':event('Parliamentary debate scheduled','A debate was scheduled; legislative consequences remain simplified in this build.','Government');render();break;case'form-government':{const seats=Math.round(543*state.partySupport/100);if(seats>=272){state.government=state.partyName;state.player.position='Party Leader';event('Government formation',`${state.partyName} reached the illustrative majority threshold in the simplified seat projection.`,'Government');toast('Illustrative majority reached.')}else{toast(`Not enough seats in current projection: ${seats}/272. Win more seats or negotiate support.`)}save(true);render();break}case'personal-expense':if(state.money>=10000){state.money-=10000;state.expenses+=10000;event('Personal expense paid','₹10,000 deducted from personal funds.','Finance');save(true);render()}else toast('Insufficient personal funds.');break;case'donate':if(state.money>=25000){state.money-=25000;state.treasury+=25000;event('Party donation',`Donated ${money(25000)} to party treasury.`,'Finance');save(true);render()}else toast('Insufficient personal funds.');break;case'fundraising':state.treasury+=100000;state.partySupport=Math.min(80,state.partySupport+0.2);event('Fundraising event','A simulated fundraising event added ₹1,00,000 to party treasury.','Finance');save(true);render();break;case'save-slot':saveSlot();break;case'export':exportSave();break;case'load-slot':loadSlot();break;default:break}}
function newPolicyModal(category='Infrastructure'){modal('Propose a Policy / Project',`<form id="policy-form"><div class="formgrid">${field('Policy or project name','name',category==='Infrastructure'?'Rural Road Connectivity':`${category} Improvement Plan`)}${selectField('Category','category',['Economy','Education','Healthcare','Infrastructure','Agriculture','Law and order','Environment','Employment','Public services','Water and energy'],category)}${field('Initial cost (₹)','cost','500000','number')}${field('Implementation time (months)','months','6','number')}</div><p class="footnote">Proposal costs are deducted immediately. Project progress advances with game time; completing a project can improve public approval.</p><div class="row between" style="margin-top:14px"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn gold">Propose & Fund</button></div></form>`)}
function saveSlot(){modal('Save Game Slot',`<form id="slot-form"><div class="field"><label>Choose slot</label><select name="slot"><option value="slot1">Slot 1</option><option value="slot2">Slot 2</option><option value="slot3">Slot 3</option></select></div><div class="field" style="margin-top:10px"><label>Save label</label><input name="label" value="${esc(state.player.name)} — ${dateLabel()}"></div><div class="row between" style="margin-top:14px"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn gold">Save Slot</button></div></form>`)}
function loadSlot(){const slots=Object.entries(state.saveSlots||{});if(!slots.length){toast('No manual save slots yet. Use Save to Slot first.');return}modal('Load Game Slot',`<div class="list">${slots.map(([k,v])=>`<div class="listitem"><div class="itemmain"><strong>${esc(v.label||k)}</strong><small>${esc(v.date||'Unknown date')} · ${esc(v.player?.name||'Player')}</small></div><button class="btn small" data-loadslot="${k}">Load</button></div>`).join('')}</div>`)}
function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nation-v0.0.6-save.json';a.click();URL.revokeObjectURL(a.href);toast('Backup export requested.')}
function importSave(file){const r=new FileReader();r.onload=()=>{try{const n=JSON.parse(r.result);if(!n||!n.player||!n.version)throw Error('Invalid save');if(!confirm('Import this save and replace the current game?'))return;state={...defaultState(),...n,version:6,player:{...defaultState().player,...n.player},settings:{...defaultState().settings,...n.settings}};save(true);go(state.started?'dashboard':'start');toast('Save imported.')}catch(e){toast('Invalid or incompatible save file. Current game preserved.')}};r.readAsText(file)}
function handleSubmit(e){e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f).entries());if(f.id==='character-form'){state.player={...state.player,name:d.name.trim()||'Player',age:Math.max(18,Math.min(90,+d.age||18)),profession:d.profession,home:d.home,background:d.background,monthlySalary:45000};state.money=Math.max(0,+d.money||100000);state.started=true;state.history.unshift({title:'Career started',date:state.date,text:`${state.player.name} began as a citizen in ${state.player.home}.`});event('Political journey started',`${state.player.name} began as an ordinary citizen in ${state.player.home}.`,'Career');save(true);go('dashboard');toast('Character created. Your political career begins.')}else if(f.id==='election-form'){createContest(d)}else if(f.id==='party-form'){if(!d.name.trim()){toast('Enter a party name.');return}state.partyName=d.name.trim();state.player.party=state.partyName;state.partySupport=8;state.treasury=250000;state.members=25;state.player.position='Party Founder';state.player.reputation=Math.min(100,state.player.reputation+2);state.history.unshift({title:'Political party founded',date:state.date,text:`Founded ${state.partyName} with a small initial organization.`});event('New party founded',`${state.partyName} begins with 25 members and limited funds.`,'Party');save(true);closeModal();render();toast('Party created.')}else if(f.id==='candidate-form'){const c={name:d.name.trim(),seat:d.seat,age:+d.age||35,education:'Graduate',profession:d.profession,popularity:Math.max(0,Math.min(100,+d.popularity||40)),loyalty:60,party:state.partyName,skill:Math.max(0,Math.min(100,+d.skill||40))};if(!c.name){toast('Enter candidate name.');return}state.candidates.push(c);event('Candidate recruited',`${c.name} added to candidate roster.`,'Party');save(true);closeModal();render()}else if(f.id==='policy-form'){const cost=Math.max(0,+d.cost||0),months=Math.max(1,Math.min(120,+d.months||6));if(cost>state.money){toast('Insufficient personal funds to fund this proposal in current build.');return}state.money-=cost;state.expenses+=cost;state.policies.push({name:d.name.trim()||'Policy proposal',category:d.category,cost,months,status:'Funded',progress:0});state.projects.push({name:d.name.trim()||'Development project',cost,months,status:'In progress',progress:0,category:d.category});event('Policy funded',`${d.name} funded at ${money(cost)} with a ${months}-month target.`,'Policy');save(true);closeModal();render();toast('Policy proposal funded.')}else if(f.id==='settings-form'){state.settings.language=d.language;state.settings.autosave=d.autosave==='Enabled';state.settings.sound=d.sound==='Enabled';save(true);toast('Preferences saved.');render()}else if(f.id==='slot-form'){state.saveSlots[d.slot]={snapshot:JSON.parse(JSON.stringify(state)),label:d.label,date:state.date};save(true);closeModal();toast('Manual save slot created.')} }
function clickHandler(e){const goel=e.target.closest('[data-go]');if(goel){go(goel.dataset.go);return}const act=e.target.closest('[data-action]');if(act){action(act.dataset.action,act);return}const st=e.target.closest('[data-state]');if(st){selectedState=st.dataset.state;render();return}const leg=e.target.closest('#leg-select');if(leg){selectedLeg=leg.value;render();return}const seat=e.target.closest('[data-seat]');if(seat){const record=makeSeats().find(x=>x.name===seat.dataset.seat)||{name:seat.dataset.seat,id:'N/A',region:'Unclassified'};modal('Constituency details',`<p class="muted">Fictional game constituency record — not an official Election Commission boundary/name.</p><div class="metricgrid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${metric('Constituency',esc(record.name),'Display name')}${metric('Type',esc(selectedLeg),'Legislature')}${metric('State / UT',esc(selectedState),'Administrative unit')}${metric('Region',esc(record.region),'Game region')}</div><div class="listitem" style="margin-top:10px"><div class="itemmain"><strong>Permanent game ID</strong><small>${esc(record.id)}</small></div></div><p class="footnote">This version uses a structured fictional explorer. Full official seat-by-seat dataset and geographic map are intentionally not claimed as complete.</p><button class="btn gold" data-action="close-modal">Close</button>`);return}const camp=e.target.closest('[data-campaign]');if(camp){doCampaign(camp.dataset.campaign,+camp.dataset.cost,+camp.dataset.score);return}const pc=e.target.closest('[data-policy-category]');if(pc){newPolicyModal(pc.dataset.policyCategory);return}const neg=e.target.closest('[data-negotiate]');if(neg){const name=neg.dataset.negotiate;const prior=state.relationships[name]||35;const success=Math.random()<Math.min(.8,.25+state.partySupport/100);state.relationships[name]=Math.min(100,prior+(success?12:-6));if(success){state.partySupport=Math.min(80,state.partySupport+1);event('Alliance proposal accepted',`${name} accepted a preliminary cooperation proposal. Formal seat-sharing is not yet modelled.`,'Party');toast(`${name} accepted a preliminary proposal.`)}else{state.relationships[name]=Math.max(0,state.relationships[name]-4);event('Alliance talks stalled',`${name} declined the initial proposal; trust fell.`,'Party');toast(`${name} declined the proposal.`)}save(true);render();return}const ev=e.target.closest('[data-event-choice]');if(ev){const choice=ev.dataset.eventChoice;let cost=choice==='Relief package'?50000:choice==='Budget discipline'?0:10000;if(state.money<cost){toast('Insufficient funds for this response.');return}state.money-=cost;state.expenses+=cost;state.approval=Math.min(95,state.approval+(choice==='Relief package'?3:choice==='Public dialogue'?2:choice==='Negotiate'?1:0));state.player.reputation=Math.min(100,state.player.reputation+(choice==='Public dialogue'?2:1));event(`Decision: ${choice}`,`You chose ${choice}; cost ${money(cost)}. Approval and reputation changed according to the scenario rules.`,'Decision');save(true);render();return}const dip=e.target.closest('[data-diplomacy]');if(dip){event(`Diplomatic plan: ${dip.dataset.diplomacy}`,`A preliminary ${dip.dataset.diplomacy.toLowerCase()} plan was recorded. Detailed international mechanics remain in development.`,'Diplomacy');render();return}const res=e.target.closest('[data-research]');if(res){modal(res.dataset.research,`<p><strong>Generated briefing</strong></p><p>Current approval is ${state.approval}%, party support is ${state.partySupport}%, personal funds are ${money(state.money)} and campaign actions completed: ${state.campaign.actions}.</p><p class="muted">This briefing uses the current local game state. It is not sourced real-world intelligence.</p><button class="btn gold" data-action="close-modal">Close</button>`);return}const edit=e.target.closest('[data-candidate-edit]');if(edit){const c=state.candidates[+edit.dataset.candidateEdit];modal('Candidate profile',`<h3>${esc(c.name)}</h3><p>${esc(c.profession)} · ${esc(c.education)} · ${esc(c.seat)}</p><p>Popularity: ${c.popularity}% · Skill: ${c.skill} · Loyalty: ${c.loyalty}%</p><button class="btn gold" data-action="close-modal">Close</button>`);return}const load=e.target.closest('[data-loadslot]');if(load){const slot=state.saveSlots[load.dataset.loadslot];if(slot){state={...defaultState(),...(slot.snapshot||slot),version:6};save(true);closeModal();go(state.started?'dashboard':'start');toast('Save slot loaded.')}return}}
document.addEventListener('click',clickHandler);document.addEventListener('submit',handleSubmit);document.addEventListener('input',e=>{if(e.target.id==='seat-search'||e.target.id==='region-filter')renderSeats()});document.addEventListener('change',e=>{if(e.target.id==='leg-select'){selectedLeg=e.target.value;render()}if(e.target.id==='region-filter')renderSeats();if(e.target.id==='import-file'&&e.target.files?.[0])importSave(e.target.files[0])});
load();render();window.addEventListener('error',e=>{console.error('NATION runtime error:',e.message);});window.addEventListener('pagehide',()=>{try{if(state.settings?.autosave)localStorage.setItem('nation_rtp_v006',JSON.stringify({...state,version:6}))}catch(e){}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});if('serviceWorker'in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
})();
</script></body></html>
